name: magic_local_storage
description: "SQLite local database layer for Magic apps: DB and Schema facades, migrations, seeders, factories, query builder and sync."
version: 1.0.1
homepage: https://anilcancakir.com/magic/local_storage
repository: https://github.com/anilcancakir/magic_local_storage
issue_tracker: https://github.com/anilcancakir/magic_local_storage/issues

topics:
  - sqlite
  - database
  - local-storage
  - magic

screenshots:
  - description: "The Magic Local Storage logo."
    path: screenshots/logo.png

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  dowel: ^1.0.0
  faker: ^2.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
