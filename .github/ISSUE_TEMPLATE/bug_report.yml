name: Bug Report
description: Report a bug in magic_local_storage
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A bug is easier to fix when it names the platform and
        the call that was wrong: `DB.table`, `Schema.create`, a migration, a seeder or sync.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Boot the app with the database provider
        2. Run `Schema.create('posts', ...)` in a migration
        3. Read the table with `DB.table('posts')`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: magic_local_storage Version
      placeholder: "0.0.1"
    validations:
      required: true

  - type: textarea
    id: flutter-doctor
    attributes:
      label: flutter doctor -v
      render: shell
